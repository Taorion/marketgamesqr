{
  "openapi": "3.1.1",
  "info": {
    "title": "Qori Invoice API — sandbox",
    "version": "0.2.0",
    "description": "Canal complementario. No emite, firma ni certifica ante DIAN. Producción no disponible."
  },
  "servers": [
    {
      "url": "/",
      "description": "Mismo origen de Qori sandbox; no hay dominio productivo asignado."
    }
  ],
  "paths": {
    "/api/invoice/v1/oauth/token": {
      "post": {
        "tags": [
          "Gateway"
        ],
        "summary": "Token Client Credentials (máximo 15 minutos)",
        "security": [
          {
            "clientBasic": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "grant_type": {
                    "const": "client_credentials"
                  },
                  "scope": {
                    "type": "string"
                  }
                },
                "required": [
                  "grant_type"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Token efímero",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Token"
                }
              }
            }
          },
          "400": {
            "description": "Error de token OAuth",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "error"
                  ],
                  "properties": {
                    "error": {
                      "enum": [
                        "invalid_client",
                        "invalid_scope",
                        "invalid_request",
                        "unsupported_grant_type",
                        "temporarily_unavailable"
                      ]
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Error de token OAuth",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "error"
                  ],
                  "properties": {
                    "error": {
                      "enum": [
                        "invalid_client",
                        "invalid_scope",
                        "invalid_request",
                        "unsupported_grant_type",
                        "temporarily_unavailable"
                      ]
                    }
                  }
                }
              }
            }
          },
          "403": {
            "description": "Scope o emisor no autorizado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "No encontrado en el ámbito autorizado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Idempotencia, revisión o estado en conflicto",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "410": {
            "description": "Original retirado por política",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Error de token OAuth",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "error"
                  ],
                  "properties": {
                    "error": {
                      "enum": [
                        "invalid_client",
                        "invalid_scope",
                        "invalid_request",
                        "unsupported_grant_type",
                        "temporarily_unavailable"
                      ]
                    }
                  }
                }
              }
            }
          },
          "429": {
            "description": "Cuota agotada; Retry-After",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Error de token OAuth",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "error"
                  ],
                  "properties": {
                    "error": {
                      "enum": [
                        "invalid_client",
                        "invalid_scope",
                        "invalid_request",
                        "unsupported_grant_type",
                        "temporarily_unavailable"
                      ]
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/invoice/v1/invoices": {
      "post": {
        "tags": [
          "Gateway"
        ],
        "summary": "Encolar original sintético",
        "description": "202 no confirma entrega ni DIAN. Misma clave/bytes retorna mismo ID; distintos bytes con misma clave:409. XML inválido: rechazo asíncrono. No admite customer_id.",
        "security": [
          {
            "invoiceToken": [
              "invoices:write"
            ]
          }
        ],
        "parameters": [
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128,
              "pattern": "^[A-Za-z0-9._:-]+$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/InvoiceInput"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Acuse técnico",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                }
              }
            }
          },
          "400": {
            "description": "Solicitud inválida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Credencial inválida o revocada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Scope o emisor no autorizado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "No encontrado en el ámbito autorizado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Idempotencia, revisión o estado en conflicto",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "410": {
            "description": "Original retirado por política",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Carga excedida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Cuota agotada; Retry-After",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Servicio no disponible",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/invoice/v1/receipts/{id}": {
      "get": {
        "tags": [
          "Gateway"
        ],
        "summary": "Acuse técnico de la aplicación",
        "description": "Nunca expone existencia, consentimiento, asignación, duplicado fiscal ni saldo. Ventana mínima de publicación:10 segundos.",
        "security": [
          {
            "invoiceToken": [
              "submissions:read"
            ]
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Estado técnico",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                }
              }
            }
          },
          "400": {
            "description": "Solicitud inválida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Credencial inválida o revocada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Scope o emisor no autorizado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "No encontrado en el ámbito autorizado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Idempotencia, revisión o estado en conflicto",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "410": {
            "description": "Original retirado por política",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Carga excedida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Cuota agotada; Retry-After",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Servicio no disponible",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "clientBasic": {
        "type": "http",
        "scheme": "basic"
      },
      "invoiceToken": {
        "type": "oauth2",
        "flows": {
          "clientCredentials": {
            "tokenUrl": "/api/invoice/v1/oauth/token",
            "scopes": {
              "invoices:write": "Enviar originales",
              "submissions:read": "Leer acuses técnicos"
            }
          }
        }
      },
      "customerSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "qori_customer_session",
        "description": "Sesión Qori existente. Mutaciones browser requieren X-Qori-Web: 1, Origin permitido y X-Qori-Account."
      },
      "adminSession": {
        "type": "http",
        "scheme": "bearer",
        "description": "JWT Qori Admin; QORI_SUPERADMIN y política de acceso vigente."
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string"
              },
              "request_id": {
                "type": "string",
                "format": "uuid"
              }
            },
            "required": [
              "code"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
      "Receipt": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "submission_id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "enum": [
              "ACCEPTED",
              "PROCESSED",
              "REJECTED"
            ]
          },
          "code": {
            "enum": [
              "INVALID_DOCUMENT",
              "PROCESSING_FAILED"
            ]
          }
        },
        "required": [
          "submission_id",
          "status"
        ]
      },
      "InvoiceInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "issuer_nit": {
            "type": "string",
            "const": "900000000"
          },
          "xml": {
            "type": "string",
            "maxLength": 524288,
            "description": "UTF-8 máximo 512 KiB. UBL Invoice, CreditNote, DebitNote o AttachedDocument embebido."
          }
        },
        "required": [
          "issuer_nit",
          "xml"
        ]
      },
      "Token": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "access_token": {
            "type": "string"
          },
          "token_type": {
            "const": "Bearer"
          },
          "expires_in": {
            "type": "integer",
            "maximum": 900
          },
          "scope": {
            "type": "string"
          }
        },
        "required": [
          "access_token",
          "token_type",
          "expires_in",
          "scope"
        ]
      }
    }
  }
}
