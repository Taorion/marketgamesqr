  "info": {
    "title": "Qori Play Sandbox API",
    "version": "1.1.0",
    "description": "Solo base local qori_play_qa. Reutiliza apps/OAuth: /developers/openapi.yaml. Customer requiere sesión existente, X-Qori-Web: 1 y Origin same-origin en escrituras; X-Qori-Account vincula cuenta esperada. Sin complete, producción o facturación. Body máximo: manage 12kb, sponsor 8kb, público/Customer 2kb."
